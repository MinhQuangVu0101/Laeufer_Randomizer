<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Läufer Randomizer ist umgezogen</title>
  <meta http-equiv="refresh" content="0;url=https://app.minhquangvu.com/laufer/">
  <link rel="canonical" href="https://app.minhquangvu.com/laufer/">
  <meta name="robots" content="noindex">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      max-width: 480px;
      margin: 4rem auto;
      padding: 0 1rem;
      line-height: 1.6;
      color: #1c1917;
      background: #fafaf9;
    }
    a { color: #15803d; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1917; color: #fafaf9; }
      a { color: #30d158; }
    }
  </style>
</head>
<body>
  <h1>Läufer ist umgezogen</h1>
  <p>Die App lebt jetzt unter <a href="https://app.minhquangvu.com/laufer/">app.minhquangvu.com/laufer</a>.</p>
  <p>Du wirst automatisch weitergeleitet…</p>
  <script>
    // Unregister any old service workers + clear caches before redirecting
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
    }
    if (window.caches) {
      caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
    }
    setTimeout(() => location.replace('https://app.minhquangvu.com/laufer/'), 500);
  </script>
</body>
</html>
